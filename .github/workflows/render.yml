name: Render video
on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition id to render"
        required: true
        default: "TitleTest"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx remotion render ${{ inputs.composition }} out/${{ inputs.composition }}.mp4 --concurrency=4
      # Also publish the MP4 (split into <90 MB parts) to a per-render branch,
      # so it can be fetched with plain git.
      - name: Publish render to branch
        run: |
          BR="render/${{ inputs.composition }}-${{ github.run_id }}"
          mkdir pub && cd pub
          split -b 90m -d "../out/${{ inputs.composition }}.mp4" "${{ inputs.composition }}.mp4.part"
          git init -q -b "$BR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Render ${{ inputs.composition }} (run ${{ github.run_id }})"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$BR"
          echo "Published to branch $BR"
