name: voice-ep4
on:
  workflow_dispatch:
  push:
    branches: [ep4]
    paths: [tools/ep4_lines.json, tools/ep4_vo.py, .github/workflows/voice-ep4.yml]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy faster-whisper
      - name: Record and check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY secret is missing"; exit 1; fi
          python tools/ep4_vo.py
      - name: Save the clips to the branch
        if: always()
        run: |
          git config user.name "voice-bot"; git config user.email "voice-bot@users.noreply.github.com"
          git add public/ep4/vo || true
          git commit -m "Episode 4 voice clips [skip ci]" || exit 0
          git push
